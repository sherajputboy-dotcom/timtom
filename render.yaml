# Render.com deployment config
# Runs as a Web Service with a health-check HTTP server on $PORT
# while the Telegram bot polls in the background.

services:
  - type: web
    name: lenskart-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
